name: Signed beta APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Validate signing secrets and decode keystore
        env:
          OSS_RELEASE_KEYSTORE_BASE64: ${{ secrets.OSS_RELEASE_KEYSTORE_BASE64 }}
          OSS_RELEASE_STORE_PASSWORD: ${{ secrets.OSS_RELEASE_STORE_PASSWORD }}
          OSS_RELEASE_KEY_ALIAS: ${{ secrets.OSS_RELEASE_KEY_ALIAS }}
          OSS_RELEASE_KEY_PASSWORD: ${{ secrets.OSS_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$OSS_RELEASE_KEYSTORE_BASE64" || { echo "Missing OSS_RELEASE_KEYSTORE_BASE64"; exit 1; }
          test -n "$OSS_RELEASE_STORE_PASSWORD" || { echo "Missing OSS_RELEASE_STORE_PASSWORD"; exit 1; }
          test -n "$OSS_RELEASE_KEY_ALIAS" || { echo "Missing OSS_RELEASE_KEY_ALIAS"; exit 1; }
          test -n "$OSS_RELEASE_KEY_PASSWORD" || { echo "Missing OSS_RELEASE_KEY_PASSWORD"; exit 1; }
          printf '%s' "$OSS_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/oss-release.jks"
          test -s "$RUNNER_TEMP/oss-release.jks"

      - name: Assemble signed release APK
        env:
          OSS_RELEASE_STORE_FILE: ${{ runner.temp }}/oss-release.jks
          OSS_RELEASE_STORE_PASSWORD: ${{ secrets.OSS_RELEASE_STORE_PASSWORD }}
          OSS_RELEASE_KEY_ALIAS: ${{ secrets.OSS_RELEASE_KEY_ALIAS }}
          OSS_RELEASE_KEY_PASSWORD: ${{ secrets.OSS_RELEASE_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Upload signed beta APK
        uses: actions/upload-artifact@v4
        with:
          name: oss-studio-beta-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
