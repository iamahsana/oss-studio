name: Signed beta APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Validate signing secrets and decode keystore
        env:
          OSS_RELEASE_KEYSTORE_BASE64: ${{ secrets.OSS_RELEASE_KEYSTORE_BASE64 }}
          OSS_RELEASE_STORE_PASSWORD: ${{ secrets.OSS_RELEASE_STORE_PASSWORD }}
          OSS_RELEASE_KEY_ALIAS: ${{ secrets.OSS_RELEASE_KEY_ALIAS }}
          OSS_RELEASE_KEY_PASSWORD: ${{ secrets.OSS_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$OSS_RELEASE_KEYSTORE_BASE64" || { echo "Missing OSS_RELEASE_KEYSTORE_BASE64"; exit 1; }
          test -n "$OSS_RELEASE_STORE_PASSWORD" || { echo "Missing OSS_RELEASE_STORE_PASSWORD"; exit 1; }
          test -n "$OSS_RELEASE_KEY_ALIAS" || { echo "Missing OSS_RELEASE_KEY_ALIAS"; exit 1; }
          test -n "$OSS_RELEASE_KEY_PASSWORD" || { echo "Missing OSS_RELEASE_KEY_PASSWORD"; exit 1; }
          printf '%s' "$OSS_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/oss-release.jks"
          test -s "$RUNNER_TEMP/oss-release.jks"

      - name: Assemble signed release APK
        env:
          OSS_RELEASE_STORE_FILE: ${{ runner.temp }}/oss-release.jks
          OSS_RELEASE_STORE_PASSWORD: ${{ secrets.OSS_RELEASE_STORE_PASSWORD }}
          OSS_RELEASE_KEY_ALIAS: ${{ secrets.OSS_RELEASE_KEY_ALIAS }}
          OSS_RELEASE_KEY_PASSWORD: ${{ secrets.OSS_RELEASE_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Verify APK signature and create checksum
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK" > "$APK.sha256"

      - name: Upload signed beta APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: oss-studio-beta-signed
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 14
