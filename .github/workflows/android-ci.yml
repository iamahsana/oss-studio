name: Android CI

on:
  push:
    branches: [ main, feature/canvas-first-scene-editor ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: oss-android-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $ANDROID_SDK_ROOT/cmdline-tools"
            find "$ANDROID_SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "Using Android SDK manager: $SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Run unit tests
        run: gradle testDebugUnitTest

      - name: Assemble debug APK
        run: gradle assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: oss-studio-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  emulator-smoke:
    name: Emulator smoke test (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 32, 35, 36]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: adb wait-for-device && n=0; until adb shell cmd package list packages >/dev/null 2>&1; do n=$((n+1)); if [ "$n" -ge 60 ]; then echo "Package Manager did not become ready"; exit 1; fi; sleep 2; done; adb shell cmd package list packages >/dev/null && gradle connectedDebugAndroidTest
      - name: Upload emulator test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports-api-${{ matrix.api-level }}
          path: |
            app/build/outputs/androidTest-results/connected/debug/**
            app/build/reports/androidTests/connected/debug/**
          if-no-files-found: warn
          retention-days: 14
